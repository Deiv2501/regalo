<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Ella 💖</title>
  <style>
    :root {
      --bg1: #fff4f8;
      --bg2: #ffeaf1;
      --card: rgba(255, 255, 255, 0.72);
      --text: #5d2a40;
      --soft-text: #6f3d52;
      --accent: #ff5fa2;
      --accent-2: #ff9fc2;
      --shadow: rgba(113, 42, 74, 0.18);
      --final: #ff4b94;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .wrap {
      width: min(92vw, 640px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .card {
      width: 100%;
      min-height: 220px;
      padding: 24px 22px;
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 111, 166, 0.22);
      box-shadow: 0 18px 35px var(--shadow);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .card p {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.24rem);
      line-height: 1.7;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--soft-text);
    }

    #container {
      width: 100%;
      display: flex;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    #container:hover {
      transform: scale(1.02);
      filter: saturate(1.1);
    }

    img {
      width: min(90vw, 500px);
      max-height: 70vh;
      object-fit: cover;
      display: block;
      border-radius: 22px;
      box-shadow: 0 18px 35px rgba(92, 31, 56, 0.25);
      border: 4px solid rgba(255, 255, 255, 0.7);
      background: #fff;
    }

    .hint {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.8;
      text-align: center;
      color: var(--soft-text);
    }

    .final-message {
      display: none;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: 1.1;
      font-weight: 900;
      color: var(--final);
      letter-spacing: 0.08em;
      text-shadow: 0 12px 30px rgba(255, 91, 162, 0.25);
      text-align: center;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    body.final .card,
    body.final #container,
    body.final .hint {
      display: none;
    }

    body.final .final-message {
      display: block;
    }

    @keyframes pulse {
      from {
        transform: scale(0.96);
        opacity: 0.88;
      }
      to {
        transform: scale(1.04);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p id="letterText"></p>
    </div>

    <div id="container">
      <img id="giftImage" src="gift%201.jpg" alt="Gift image" />
    </div>

    <div class="hint" id="hintText">Haz clic para seguir</div>

    <div class="final-message" id="finalMessage">YO TE AMO LESS</div>
  </div>

  <script>
    const phases = [
      {
        image: "gift%201.jpg",
        text: "Para empezar, aún no sé si mi Dios ya me haya permitido conocerte o si aún no lo haga... pero sin duda lo sabré ese día tan especial en el que estemos frente a frente, con Dios como testigo, haciendo una promesa de amor.",
        hint: "Haz clic para seguir"
      },
      {
        image: "gift%202.jpg",
        text: "Eres y serás mi regalo del cielo, aquel que en verdad soñaba y suspiraba por ver, aquel que anhelaba poder compartir los más pequeños detalles de la vida: las risas, las sonrisas, los momentos más dulces, las noches estrelladas, admirar el cielo, admirar la luna... y sobre todo admirar a la más hermosa creación que Dios puso en mi vida... Less.",
        hint: "Haz clic para seguir"
      },
      {
        image: "gift%203.jpg",
        text: "Te espero, oro por ti, oro por tus procesos, oro por lo que Dios está haciendo en tu vida, y oro para que tu más grande amor sea Jesús; que lo ames con toda tu fuerza y con todo tu corazón. Quiero decirte que aún estoy creciendo en amor para ti... No hay día en el que no le pida a mi Dios que me enseñe a amar, para que el día en que estés a mi lado sepa tratarte como mereces. Yo no estoy dispuesto a dar menos; ¿cómo dar menos si mi Dios murió por amor a su iglesia? No tengo miedo de morir y verme crucificado. Dios me ha creado para amar de verdad, y lucharé por ello.",
        hint: "Haz clic para entenderlo todo"
      },
      {
        image: "gift%201.jpg",
        text: "Ahora sé que tú eres el amor de mi vida, Less. Aunque no sabemos todavía cuál será el camino ni en qué tiempo nos encontramos, quiero que sepas que mi corazón ya te ha elegido, y que yo me entrego a esta historia con amor, paciencia, fe y esperanza. Quiero creer en lo que Dios tiene preparado para nosotros, y en que, tarde o temprano, si es Su voluntad, nos volveremos a encontrar para ser felices al fin.",
        hint: "Haz clic para la última palabra"
      }
    ];

    const letterText = document.getElementById("letterText");
    const giftImage = document.getElementById("giftImage");
    const hintText = document.getElementById("hintText");
    const container = document.getElementById("container");
    const finalMessage = document.getElementById("finalMessage");

    let index = 0;

    function renderPhase() {
      const phase = phases[index];
      letterText.textContent = phase.text;
      giftImage.src = phase.image;
      hintText.textContent = phase.hint;
    }

    container.addEventListener("click", () => {
      index++;

      if (index < phases.length) {
        renderPhase();
        return;
      }

      document.body.classList.add("final");
      finalMessage.textContent = "YO TE AMO LESS";
    });

    renderPhase();
  </script>
</body>
</html>
